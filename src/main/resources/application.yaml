server:
  port: 8080
  shutdown: GRACEFUL
  compression:
    enabled: true
spring:
  application:
    name: hotel-modulith

  modulith:
    events:
      externalization:
        enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/hmodulith_db
    username: hmodulith
    password: hmodulithapp
  sql:
    init:
      mode: ALWAYS
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
    show-sql: true
  docker:
    compose:
      enabled: false
logging:
  level:
    org:
      springframework:
        jdbc:
          datasource:
            init: DEBUG